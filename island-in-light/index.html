<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The island, drawn in light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,300;1,400&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sea:#0e2231; --deep:#07131c; --flare:#d04a9a; --flare-text:#f08cc6; --lamp:#fff4d6;
  --red:#ff5a4e; --green:#3fdc8a; --ink:#dfe8ee; --muted:#8aa3b3; --line:#23404f;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --cond:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--deep);color:var(--ink);font-family:var(--serif);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.side{position:fixed;top:calc(28px + env(safe-area-inset-top,0px));left:32px;width:320px;max-width:calc(100% - 40px);pointer-events:none}
.side > *{pointer-events:auto}
h1{font-weight:300;font-style:italic;font-size:2.4rem;line-height:1.05;margin:0 0 .6rem;letter-spacing:-.01em}
.lede{font-size:1rem;line-height:1.55;color:var(--muted);margin:0 0 1.2rem;max-width:30ch}
.modes{display:flex;gap:6px;margin-bottom:1.2rem}
.modes button{font-family:var(--cond);font-size:.95rem;font-weight:500;color:var(--muted);background:transparent;border:1px solid var(--line);padding:.4rem .8rem;border-radius:999px;cursor:pointer}
.modes .toggle{margin-left:auto}
.modes .toggle[aria-pressed="true"]{color:var(--ink);background:transparent;border-color:var(--muted)}
.modes button[aria-pressed="true"]:not(.toggle){color:var(--deep);background:var(--lamp);border-color:var(--lamp)}
button:focus-visible{outline:2px solid var(--flare);outline-offset:2px}
.card{background:rgba(7,19,28,.82);border:1px solid var(--line);border-radius:6px;padding:1rem 1.1rem 1.1rem;backdrop-filter:blur(4px)}
.card h2{font-weight:600;font-size:1.35rem;margin:0 0 .15rem}
.char{font-family:var(--cond);font-weight:600;font-size:1.7rem;color:var(--flare-text);letter-spacing:.02em;margin:.1rem 0 .3rem}
.plain{margin:0 0 .7rem;line-height:1.45}
.strip{display:block;width:100%;height:34px;margin:.2rem 0 .3rem}
.axis{font-family:var(--cond);font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:.7rem}
.meta{font-family:var(--cond);font-size:.95rem;color:var(--muted);margin:0 0 .5rem}
.note{font-style:italic;line-height:1.5;margin:0;color:#c7d5de}
.hint{font-style:italic;color:var(--muted);line-height:1.5;margin:0}
.opts{display:grid;gap:6px;margin-top:.8rem}
.opts button{text-align:left;font-family:var(--serif);font-size:1rem;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:.5rem .7rem;cursor:pointer;display:flex;justify-content:space-between;gap:1rem}
.opts button span{font-family:var(--cond);color:var(--flare-text);font-weight:600}
.opts button.right{border-color:var(--green)}
.opts button.wrong{border-color:var(--red);opacity:.7}
.opts button:disabled{cursor:default}
.next{margin-top:.8rem;font-family:var(--cond);font-size:1rem;font-weight:600;background:var(--lamp);color:var(--deep);border:0;border-radius:999px;padding:.45rem 1rem;cursor:pointer}
.clock{font-family:var(--cond);font-size:2.4rem;font-weight:500;color:var(--lamp);font-variant-numeric:tabular-nums;margin:.2rem 0 0}
.score{font-family:var(--cond);color:var(--muted);font-size:.95rem}
.src{font-size:.78rem;font-style:italic;color:#6f8a9a;line-height:1.4;margin:.9rem 0 0;border-top:1px solid var(--line);padding-top:.6rem}
.oldfoot{position:fixed;right:18px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:.8rem;font-style:italic;color:#5f7a8a;max-width:46ch;text-align:right;line-height:1.4}
.tip{position:fixed;pointer-events:none;font-family:var(--cond);font-size:.95rem;color:var(--lamp);background:rgba(7,19,28,.85);border:1px solid var(--line);padding:.2rem .5rem;border-radius:3px;transform:translate(12px,-50%);white-space:nowrap;display:none}
@media (max-width:760px){
  .side{left:16px;right:16px;width:auto;top:calc(14px + env(safe-area-inset-top,0px))}
  h1{font-size:1.7rem}
  .lede{font-size:.92rem;margin-bottom:.7rem}
  .card{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:44vh;overflow:auto}
  .card .close{position:sticky;float:right;top:0;margin:-.3rem -.4rem 0 0;background:rgba(7,19,28,.95)}
  .lede .more{display:none}
  .src{font-size:.78rem;font-style:italic;color:#6f8a9a;line-height:1.4;margin:.9rem 0 0;border-top:1px solid var(--line);padding-top:.6rem}
.oldfoot{display:none}
}
@media (min-width:761px){.card{position:relative}}
.close{position:absolute;top:.5rem;right:.5rem;width:2rem;height:2rem;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:1.2rem;line-height:1;cursor:pointer}
.close:hover{border-color:var(--muted)}
.card h2{padding-right:2.2rem}
.county{margin:0 0 .3rem;font-style:italic;color:var(--muted)}
.find{display:block;margin-bottom:.8rem}
.find{position:relative}
.find input{width:100%;font-family:var(--serif);font-size:1rem;color:var(--ink);background:rgba(7,19,28,.82);border:1px solid var(--line);border-radius:6px;padding:.5rem 2.6rem .5rem .8rem;backdrop-filter:blur(4px)}
.find input::placeholder{color:var(--muted);font-style:italic}
.find input:focus{outline:none;border-color:var(--muted)}
.find input:focus-visible{outline:2px solid var(--flare);outline-offset:2px}
.find button{position:absolute;right:1px;top:1px;bottom:1px;width:2.4rem;border:0;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:0 6px 6px 0}
.find button:hover{color:var(--ink)}
.find[data-open] button svg{transform:rotate(180deg)}
.find ul{position:absolute;left:0;right:0;top:calc(100% + 4px);margin:0;padding:.3rem;list-style:none;max-height:min(50vh,340px);overflow:auto;background:rgba(7,19,28,.97);border:1px solid var(--line);border-radius:6px;z-index:6}
.find li{padding:.4rem .6rem;border-radius:3px;cursor:pointer;display:flex;justify-content:space-between;gap:1rem}
.find li{align-items:center}
.find li .nm small{display:block;font-size:.8rem;color:var(--muted);font-style:italic;margin-top:.05rem}
.find li .ch{font-family:var(--cond);color:var(--flare-text);font-weight:600;white-space:nowrap}
.find li[aria-selected="true"],.find li:hover{background:#15324a}
.find .empty{color:var(--muted);font-style:italic;cursor:default}
.find .empty:hover{background:transparent}
.pick{position:fixed;display:none;background:rgba(7,19,28,.95);border:1px solid var(--line);border-radius:6px;padding:.4rem;z-index:5;min-width:12rem}
.pick p{margin:.1rem .4rem .35rem;font-style:italic;color:var(--muted);font-size:.9rem}
.pick button{display:block;width:100%;text-align:left;font-family:var(--serif);font-size:1rem;color:var(--ink);background:transparent;border:0;border-radius:3px;padding:.45rem .5rem;cursor:pointer}
.pick button:hover,.pick button:focus-visible{background:#15324a;outline:none}
@media (max-width:760px){.find{margin-bottom:.5rem}}
</style>
</head>

function parse(ch,gapOverride,longDur){

  else if(kind==="Q"){for(let i=0;i<n;i++)pulses.push([i*1,0.3]);}
  else if(kind==="Iso"){pulses.push([0,T/2]);}

function plain(s){

  const w=c.length>1?"":` ${c[0]}`;
  const T=s.T;
  let t;
  if(s.kind==="Fl") t=`${NUM[s.n]}${w} flash${s.n>1?"es":""} every ${T} seconds`;
  else if(s.kind==="LFl") t=`One long${w} flash every ${T} seconds`;
  else if(s.kind==="Q") t=`${NUM[s.n]} quick${w} flashes every ${T} seconds`;
  else if(s.kind==="Iso") t=`Equal light and dark,${w?w+",":""} ${T/2} seconds each`;

}

      x+=a[i];y+=a[i+1];const lo=x/1e4,la=y/1e4,[X,Y]=proj(la,lo);

  const li=fList.children[fActive];li.scrollIntoView({block:"nearest"});find.setAttribute("aria-activedescendant",li.id);}
find.addEventListener("input",()=>openList(find.value));
find.addEventListener("focus",()=>openList(""));
find.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();fList.hidden?openList(find.value):moveActive(1);}
  else if(e.key==="ArrowUp"){e.preventDefault();moveActive(-1);}
  else if(e.key==="Enter"&&!fList.hidden&&fActive>=0){e.preventDefault();select(fItems[fActive]);find.blur();}
  else if(e.key==="Escape"){e.stopPropagation();closeList();find.blur();}
});
fList.addEventListener("pointerdown",e=>{const li=e.target.closest("li[data-i]");if(li){e.preventDefault();select(L[+li.dataset.i]);find.blur();}});
document.getElementById("findBtn").addEventListener("click",()=>{if(fList.hidden){find.focus();}else closeList();});
find.addEventListener("blur",()=>setTimeout(closeList,120));
function closeCard(){selected=null;find.value="";closeList();card.innerHTML=HINT;}
const SRC=`<p class="src">Characters from the Lighthouse Directory, which cites the Irish Lights and Admiralty lists. Coastline &copy; OpenStreetMap contributors. Not for navigation.</p>`;
const HINT=`<p class="hint">Tap or hover any light to read its signature. Where lights sit close together you'll be asked which one you meant.</p>`+SRC;
addEventListener("keydown",e=>{if(e.key==="Escape"){if(pick.style.display==="block")closePick();else if(mode==="explore")closeCard();}});

function strip(s){
  const w=300,h=34,sc=w/s.T,c=`rgb(${RGB[s.main].join(",")})`;
  let bars=s.fixed?`<rect x="0" y="${h-6}" width="${w}" height="3" fill="${c}" opacity=".35"/>`:"";
  s.pulses.forEach(([a,d])=>{bars+=`<rect x="${(a*sc).toFixed(1)}" y="4" width="${Math.max(2,d*sc).toFixed(1)}" height="${h-8}" rx="1" fill="${c}"/>`;});
  return `<svg class="strip" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><rect width="${w}" height="${h}" fill="#07131c"/>${bars}</svg><div class="axis"><span>0</span><span>one cycle</span><span>${s.T} s</span></div>`;
}
function showCard(l){
  card.innerHTML=`<button class="close" aria-label="Close">&times;</button><h2>${l[0]}</h2><p class="county">County ${l.county}</p><div class="char">${l[3]}</div><p class="plain">${plain(l.s)}</p>${strip(l.s)}
  <p class="meta">Lit ${l[5]} &nbsp; Seen ${l[4]} nautical miles out</p>${l[6]?`<p class="note">${l[6]}</p>`:""}${SRC}`;
  card.querySelector(".close").onclick=closeCard;
}

let score=0,tries=0;
function newRound(){
  const pool=[...L].sort(()=>Math.random()-.5);
  const light=pool[0],opts=[light],seen=new Set([light[3]]);
  for(const l of pool){if(opts.length>=4)break;if(!seen.has(l[3])){seen.add(l[3]);opts.push(l);}}
  opts.sort(()=>Math.random()-.5);
  game={light,opts,answered:false,start:performance.now()};
  light.phase=-0.8-(performance.now()/1000); // first flash 0.8 s after the round starts
  light.phase=((light.phase%light.s.T)+light.s.T)%light.s.T;
  card.innerHTML=`<p class="hint">You're at sea, it's dark, and one light is showing. Count the flashes and time the cycle, then pick it off the chart.</p>
  <div class="clock" id="clock">0.0 s</div>
  <div class="opts">${opts.map((o,i)=>`<button data-i="${i}">${o[0]}<span>${o[3]}</span></button>`).join("")}</div>
  <p class="score">${tries?`${score} of ${tries} so far`:""}</p>`;
  card.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){
  if(game.answered)return;game.answered=true;tries++;
  const ok=game.opts[i]===game.light;if(ok)score++;
  card.querySelectorAll(".opts button").forEach((b,j)=>{b.disabled=true;if(game.opts[j]===game.light)b.classList.add("right");else if(j===i)b.classList.add("wrong");});
  selected=game.light;
  const msg=document.createElement("div");
  msg.innerHTML=`<p class="plain" style="margin-top:.8rem">${ok?"Right.":"Not that one."} It was ${game.light[0]}: ${plain(game.light.s).toLowerCase()}</p><button class="next">Next light</button>`;
  card.appendChild(msg);card.querySelector(".score").textContent=`${score} of ${tries} so far`;
  msg.querySelector(".next").onclick=newRound;
}
function setMode(m){
  mode=m;document.getElementById("mExplore").setAttribute("aria-pressed",m==="explore");
  document.getElementById("mGame").setAttribute("aria-pressed",m==="game");
  selected=null;
  closePick();document.getElementById("findWrap").style.display=m==="game"?"none":"block";
  if(m==="game")newRound();else{game=null;closeCard();}
}
document.getElementById("mExplore").onclick=()=>setMode("explore");
document.getElementById("mGame").onclick=()=>setMode("game");
card.innerHTML=HINT;
document.getElementById("tCoast").onclick=e=>{showCoast=!showCoast;e.currentTarget.setAttribute("aria-pressed",showCoast);buildBase();};
</script>
</body>
</html>
